# GitHub Actions Post Section Example

This workflow demonstrates how to create a Jenkins-style `post` section in GitHub Actions using conditional expressions like:

* `success()`
* `failure()`
* `cancelled()`
* `always()`

Unlike Jenkins, GitHub Actions does not provide a dedicated `post` block. Instead, post-execution behavior is implemented using conditional steps with the `if` keyword.

These conditions are extremely useful in CI/CD pipelines for:

* Sending notifications
* Cleaning temporary files
* Uploading logs
* Triggering rollback actions
* Handling deployment failures

This workflow intentionally fails the build step to demonstrate how post-condition handlers work.

---

# Workflow File

# Workflow name shown in GitHub Actions UI
name: Job Post Section Example

# Trigger workflow on every push
on: [push]

jobs:

  # Job name
  build:

    # Runner machine
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Main Job Steps
      # -------------------------

      # Simulate repository checkout
      - name: Checkout
        run: echo "Cloning repo..."

      # Simulate build process
      - name: Run build
        run: |

          # Print message
          echo "Running build..."

          # Force step failure intentionally
          # exit 1 returns non-zero status
          # which marks job as failed
          exit 1

      # -------------------------
      # POST SECTION (Jenkins Style)
      # -------------------------

      # Executes only when all previous steps succeed
      - name: Post - Success
        if: ${{ success() }}
        run: echo "🎉 Job SUCCESS — run success tasks here"

      # Executes only when workflow/job fails
      - name: Post - Failure
        if: ${{ failure() }}
        run: echo "❌ Job FAILED — run failure actions here"

      # Executes only when workflow gets cancelled
      - name: Post - Cancelled
        if: ${{ cancelled() }}
        run: echo "🛑 Job CANCELLED — run cancel handlers here"

      # Executes regardless of workflow result
      # Commonly used for cleanup tasks
      - name: Post - Always
        if: ${{ always() }}
        run: echo "🔄 ALWAYS — this runs no matter what (cleanup)"
```

---

# Important Concepts

# success()

if: ${{ success() }}
```

Runs step only when:

* All previous steps completed successfully
* No failures occurred

Common use cases:

* Success notifications
* Production deployments
* Release tagging

---

# failure()

if: ${{ failure() }}
```

Runs step only when:

* Any previous step fails

In this workflow:

exit 1
```

forces the build step to fail.

Therefore:

* `Post - Failure` step executes

Common use cases:

* Slack alerts
* Email notifications
* Rollback actions
* Error log uploads

---

# cancelled()

if: ${{ cancelled() }}
```

Runs step only when:

* Workflow execution is manually cancelled
* Workflow stops due to concurrency cancellation

Common use cases:

* Release locks cleanup
* Temporary resource cleanup
* Deployment unlock handlers

---

# always()

if: ${{ always() }}
```

Runs regardless of:

* Success
* Failure
* Cancellation

This is commonly used for:

* Cleanup tasks
* Artifact uploads
* Log collection
* Resource destruction

Equivalent to:

```text id="c7u4pe"
finally block
```

in programming languages.

---

# Workflow Execution Flow

## Actual Flow in This Workflow

Workflow Starts
       ↓
Checkout Step
       ↓
Run Build Step
       ↓
Build Fails (exit 1)
       ↓
Success Step → Skipped
       ↓
Failure Step → Executes
       ↓
Cancelled Step → Skipped
       ↓
Always Step → Executes
       ↓
Workflow Complete
```

---

# Why `exit 1` Is Used

exit 1
```

returns a non-zero exit code.

In Linux:

* `0` → success
* non-zero → failure

GitHub Actions treats non-zero exit codes as failed steps.

This is intentionally used here to demonstrate failure handling behavior.

---

# Real DevOps Use Cases

## success()

Used for:

* Deployment success notifications
* Production releases
* Version tagging

---

## failure()

Used for:

* Incident alerts
* Rollback triggers
* Debug log collection
* PagerDuty notifications

---

## cancelled()

Used for:

* Cleanup unfinished deployments
* Remove temporary environments
* Unlock release pipelines

---

## always()

Used for:

* Delete temp files
* Upload test reports
* Archive logs
* Cleanup Docker containers

---

# Comparison with Jenkins

In Jenkins pipelines

post {
   success { }
   failure { }
   always { }
}
```

GitHub Actions achieves similar behavior using:

if: success()
if: failure()
if: always()
```

---

# Why Post Conditions Are Important

Without post-condition handling:

* Failed deployments may not trigger alerts
* Cleanup may never happen
* Logs may get lost
* Temporary resources may remain active

Post-condition steps make CI/CD pipelines:

* Safer
* More reliable
* Easier to debug
* Production-ready

This is an important concept in advanced DevOps automation using GitHub Actions.

---

# How to Run

1. Push code to repository
2. Open Actions tab
3. Select workflow run
4. Observe:

   * Build step fails
   * Failure handler executes
   * Always step executes
5. Review workflow logs

