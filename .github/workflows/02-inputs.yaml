name: Inputs Demo

# This workflow runs manually from the GitHub Actions tab
on:
  workflow_dispatch:

    # Inputs section → allows user to enter values before running workflow
    inputs:

      # Simple text input
      name:
        description: "Enter your name"
        required: true
        default: "DevOps Engineer"

      # Environment type input
      # Automatically shows available GitHub environments
      # Example: dev, staging, prod
      env:
        description: "Select environment (GitHub environment type)"
        required: true
        type: environment

      # Boolean input → true or false
      # Displays checkbox in GitHub UI
      deploy:
        description: "Do you want to deploy?"
        type: boolean
        required: true
        default: false

      # Choice input → dropdown selection
      log_level:
        description: "Choose log level"
        type: choice
        options:
          - info
          - warn
          - error
        required: true
        default: info

      # Number/Text input
      retry_count:
        description: "Number of retries"
        required: false
        default: "3"

jobs:

  # Job name
  print-inputs:

    # Runner machine
    runs-on: ubuntu-latest

    steps:

      # Step to print all input values
      - name: Print Inputs
        run: |
          echo "========== USER INPUTS =========="

          # Accessing text input
          echo "Name: ${{ github.event.inputs.name }}"

          # Accessing environment input
          echo "Environment: ${{ github.event.inputs.env }}"

          # Accessing boolean input
          echo "Deploy Enabled: ${{ github.event.inputs.deploy }}"

          # Accessing dropdown choice input
          echo "Log Level: ${{ github.event.inputs.log_level }}"

          # Accessing retry count input
          echo "Retry Count: ${{ github.event.inputs.retry_count }}"