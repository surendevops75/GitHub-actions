# Workflow Flow

## Push to Main Branch

```text id="w4n7sx"
Developer pushes code → main branch
        ↓
Workflow starts
        ↓
Hello World step runs
        ↓
PROD deployment step runs
        ↓
DEV deployment step is skipped
```

---

## Push to Feature Branch

```text id="v9c6pt"
Developer pushes code → feature-login branch
        ↓
Workflow starts
        ↓
Hello World step runs
        ↓
DEV deployment step runs
        ↓
PROD deployment step is skipped
```

---

# Real DevOps Use Cases

Conditional execution is heavily used in CI/CD pipelines for:

* Production deployments
* Staging deployments
* Feature environment deployments
* Security scans
* Approval workflows
* Branch-specific testing
* Release automation

Example:

* `main` → deploy to production
* `develop` → deploy to staging
* `feature-*` → deploy to development

---

# Common Conditional Functions

## startsWith()

```yaml id="r3y6ml"
startsWith(github.ref, 'refs/heads/feature-')
```

Checks whether a string starts with a value.

---

## contains()

```yaml id="m8k1wb"
contains(github.ref, 'release')
```

Checks whether string contains specific text.

---

## endsWith()

```yaml id="q4u8zn"
endsWith(github.ref, '-prod')
```

Checks whether string ends with specific text.

---

# Why Conditions Are Important

Without conditions:

* Every deployment runs for every branch
* Production deployments may trigger accidentally
* CI/CD pipelines become unsafe

Using conditions helps:

* Automate branch-based workflows
* Protect production environments
* Create smarter deployment pipelines
* Reduce unnecessary executions

This is a core concept in modern DevOps automation using GitHub Actions.

---

# How to Run

1. Push code to different branches
2. Open GitHub Actions tab
3. Observe workflow execution
4. Check which steps were executed or skipped
5. Verify branch-based deployment logic

