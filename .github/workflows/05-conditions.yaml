# GitHub Actions Conditions Example

This workflow demonstrates how to use conditional execution in GitHub Actions using the `if` keyword.

Conditional statements allow workflows to execute specific steps only when certain conditions are met. This is extremely useful in CI/CD pipelines because different branches often require different deployment behaviors.

In this example:

* Code pushed to the `main` branch triggers a production deployment step
* Code pushed to feature branches triggers a development deployment step

This helps automate environment-specific deployments using branch-based logic.

---

# Workflow File
# Workflow name shown in GitHub Actions UI
name: Conditions

# Trigger workflow whenever code is pushed
on: [push]

jobs:

  # Job name
  conditions-demo:

    # Runner machine
    runs-on: ubuntu-latest

    steps:

      # Simple step to print message
      - name: Print Hello World
        run: echo "Hello, world!"

      # Execute this step only when code is pushed to main branch
      # refs/heads/main → full Git reference for main branch
      - name: trigger PROD deploy
        if: github.ref == 'refs/heads/main'
        run: echo "deploy to PROD"

      # Execute this step only for feature branches
      # startsWith() is commonly used for branch pattern matching
      - name: trigger DEV deploy
        if: startsWith(github.ref, 'refs/heads/feature-')
        run: echo "deploy to DEV"
```

---

# Important Concepts

## if Condition

The `if` keyword is used to conditionally execute steps, jobs, or workflows.

Example:
if: github.ref == 'refs/heads/main'
```

If the condition evaluates to:

* `true` → step executes
* `false` → step is skipped

---

# github.ref

The `github.ref` context contains the full Git reference of the branch or tag that triggered the workflow.

Examples:
refs/heads/main
refs/heads/dev
refs/heads/feature-login
```

---

# Production Deployment Condition

```yaml id="x8q5na"
if: github.ref == 'refs/heads/main'
```

This condition ensures:

* Step runs only for the `main` branch
* Commonly used for production deployments

Example flow:

* Push to `main`
* Workflow runs
* PROD deployment step executes

---

# Feature Branch Deployment Condition

```yaml id="n5v2qy"
if: startsWith(github.ref, 'refs/heads/feature-')
```

This condition checks whether the branch name starts with `feature-`.

Examples:

* feature-login
* feature-auth
* feature-payment

These branches will trigger the DEV deployment step.

---

# Why `startsWith()` Is Used

Branch pattern matching should use functions like:

```yaml id="t7r1pk"
startsWith()
contains()
endsWith()
```

because direct wildcard matching like:

```yaml id="f2m9za"
github.ref == 'refs/heads/feature-*'
```

does not work correctly in GitHub Actions expressions.

